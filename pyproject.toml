[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-pve-cloud"
authors = [{ name = "Tobias Huebner", email = "tobias.huebner@vmzberlin.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]

dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "pve_cloud_test._version.__version__"}

[tool.setuptools.package-data]
"pve_cloud_test" = ["*.yaml"]

[project.scripts]
tddog = "pve_cloud_test.tdd_watchdog:main"
mock-server = "pve_cloud_test.terraform:launch_gw_mock_manually"
# agentic development entrypoints / clis
vcluster-mcp = "pve_cloud_test.vcluster_mcp:main"
integration-api = "pve_cloud_test.integration_api:main"
source-rag-mcp = "pve_cloud_test.source_rag_mcp:main"
rag-inserter = "pve_cloud_test.source_rag_mcp:inserter"
