type: object
description: |
  Config / Inventory file for pve cloud e2e tests. This is the basis for deploying the entire testing suite.
  It contains a lot of partials from non testing pxc schemas.
additionalProperties: false
required:
  - pve_test_cluster_name
  - pve_test_cluster_hosts
  - pve_test_cluster_floating_external
  - pve_test_cluster_floating_internal
  - pve_vm_storage_id
  - ceph_csi_storage_pool
  - ssh_pub_key
  - cloud_inventory
  - kubernetes
properties:
  pve_test_cluster_name:
    type: string
    description: Proxmox testing cluster name (as defined in the proxmox ui on the create cluster step).
  pve_test_cluster_jump_host:
    type: string
    description: |
      Optional jump host for connecting the the test proxmox cluster. When defined the entire suite is testing via the jump
      proxy functionality. 
  pve_test_cluster_hosts:
    type: object
    title: "PVE Cluster name"
    description: Legacy / Fallback schema like ansible yaml inventory of proxmox hosts that make up the testing cluster.
    additionalProperties: false
    patternProperties:
      "^.*$": 
        type: object
        title: "PVE Host name"
        additionalProperties: false
        required:
          - ansible_user
          - ansible_host
        properties:
          ansible_user:
            type: string
          ansible_host:
            type: string
  pve_test_cluster_host_vars:
    type: object
    description: Host vars passed to the different hosts of the cluster, used during the setup_pve_clusters playbook.
    patternProperties:
      "^.*$": 
        type: object
        title: "PVE Host name"
  
  pve_test_cluster_floating_external:
    type: string
    description: Haproxy floating ip for external forwards.
  pve_test_cluster_floating_internal:
    type: string
    description: Central haproxy floating ip for internal traffic and services.

  pve_vm_storage_id:
    type: string
    description: Storage id string created in the proxmox ui. Can be ceph pool as storage or local-lvm, local-zfs, etc.
  ceph_csi_storage_pool:
    type: string
    description: Storage pool kubernetes ceph csi will use.
  ssh_pub_key:
    type: string
    description: ssh public key that will be installed in all testing lxcs/vms.
  pve_test_net0_vlan_tag:
    type: string
    description: can be optionally defined, this will set vlan tag for the primary network interface of all vms/lxcs.

  pve_ceph_frontend_dhcp_iface:
    type: string
    description: If this is defined the testing suite will deploy a dedicated lxc for ceph frontend dhcp.
  pve_ceph_frontend_dhcp_net:
    type: string
    description: See pve_ceph_frontend_dhcp_iface.
  pve_ceph_frontend_dhcp_pool:
    type: string
    description: See pve_ceph_frontend_dhcp_iface.

  cloud_inventory:
    type: object
    additionalProperties: false
    description: Mapped almost 1:1 to pxc.cloud.pve_cloud_inv
    required:
      - pve_cloud_domain
      - pve_vm_subnet
      - bind_master_ip
      - bind_slave_ip
      - bind_arpa_zone_service_lxcs
      - bind_additional_arpa_zones
      - bind_zone_admin_email
      - kea_dhcp_main_ip
      - kea_dhcp_failover_ip
      - kea_dhcp_routers
      - kea_dhcp_pools
      - kea_dhcp_static_routes
    properties:
      pve_cloud_domain:
        type: string
      pve_vm_subnet:
        type: string
      bind_master_ip:
        type: string
      bind_slave_ip:
        type: string
      bind_arpa_zone_service_lxcs:
        type: string
      bind_additional_arpa_zones:
        type: array
        items:
          type: string
      bind_zone_admin_email:
        type: string
      bind_forward_zones:
        type: array
        items:
          type: object
          properties:
            zone:
              type: string
            nameservers:
              type: array
              items:
                type: string
      kea_dhcp_main_ip:
        type: string
      kea_dhcp_failover_ip:
        type: string
      kea_dhcp_routers:
        type: string
      kea_dhcp_pools:
        type: array
        items:
          type: string
      kea_dhcp_static_routes:
        type: string

  kubernetes:
    type: object
    description: config options for test kubespray clusters that the suite creates.
    required:
      - k8s_tls_copy_target_pve
      - k8s_tls_copy_stack_name
      - deployments_domain
    properties:
      k8s_tls_copy_target_pve:
        type: string
        description: Target proxmox cluster (external) from which to copy tls certificates. Dev machine needs ssh to it and dns needs to be configured.
      k8s_tls_copy_stack_name:
        type: string
        description: Stack name inside the target pve from which the test suite will copy a valid acme cert. This clusters cert should be extend to contain the deployments_domain.
      deployments_domain:
        type: string
        description: domain used for test deployments of the suites kubernetes clusters. This needs to be delegated correctly in your central dns.

  terraform_parameters:
    type: object
    description: Dynamic variables that are optionally checked by the testing suite and passed to testing modules. Consolidate the test files to extend.

  plugin:
    type: string
    description: "Id of ansible inventory plugin, needs to be set exactly."
    enum:
      - pxc.cloud.pve_cloud_test_env
